<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SkillSwap - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #81c3d7 0%, #3292af 100%);
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        max-width: 400px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      h1 {
        color: #3292af;
        margin-bottom: 20px;
      }
      p {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      .button {
        background: #3292af;
        color: white;
        padding: 15px 40px;
        border-radius: 10px;
        text-decoration: none;
        display: inline-block;
        font-weight: bold;
        transition: background 0.3s;
      }
      .button:hover {
        background: #2f6690;
      }
      .error {
        color: #d94f21;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Reset Your Password</h1>
      <p id="message">
        Click the button below to open SkillSwap and reset your password.
      </p>
      <a href="#" id="deeplink" class="button">Open SkillSwap</a>
      <p style="margin-top: 20px; font-size: 14px; color: #999">
        If the app doesn't open, make sure SkillSwap is installed on your
        device.
      </p>
    </div>

    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        document.getElementById("message").innerHTML =
          '<span class="error">Invalid or missing reset token.</span>';
        document.getElementById("deeplink").style.display = "none";
      } else {
        // Create deep link
        const deepLink = `skillswap://reset-password?token=${token}`;
        document.getElementById("deeplink").href = deepLink;

        // Auto-redirect after 2 seconds
        setTimeout(() => {
          window.location.href = deepLink;
        }, 2000);
      }
    </script>
  </body>
</html>
